name: Test and deploy

# Manual only (Actions › Test and deploy › Run workflow) to save Actions minutes.
# Run it locally first: npm run data:build && npm test && npm run build
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Re-parse the committed almanac text and fail if the catalog drifted.
      - run: npm run data:build
      - run: git diff --exit-code src/data/generated/catalog.json
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: vars.DEPLOY_PAGES == 'true'
        with:
          path: dist

  # Skipped until Pages is enabled: set the repository variable DEPLOY_PAGES=true
  # (Settings › Secrets and variables › Actions › Variables).
  deploy:
    if: vars.DEPLOY_PAGES == 'true' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
